<style>

body{
    background:#f5f7fa;
    font-family:'Segoe UI',sans-serif;
}

.hero{
    background:#003E7E;
    color:white;
    padding:40px 0;
}

.hero h1{
    font-weight:300;
}

.card-custom{
    background:white;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    padding:25px;
    margin-top:25px;
    margin-bottom:60px;
}

.department-header{
    background:#eef4ff;
    color:#003E7E;
    font-weight:600;
    padding:12px;
    border-radius:8px;
    margin-top:25px;
}

.table td,
.table th{
    vertical-align:middle;
}

.doc-table{
    width:100%;
    table-layout:fixed;
}

.doc-table th,
.doc-table td{
    overflow-wrap:anywhere;
}

.doc-table .col-docno{width:16%;}
.doc-table .col-title{width:30%;}
.doc-table .col-type{width:13%;}
.doc-table .col-rev{width:7%;}
.doc-table .col-date{width:14%;}
.doc-table .col-open{width:10%;}
.doc-table .col-guide{width:10%;}

.doc-table th:nth-child(4),
.doc-table td:nth-child(4),
.doc-table th:nth-child(6),
.doc-table td:nth-child(6),
.doc-table th:nth-child(7),
.doc-table td:nth-child(7){
    text-align:center !important;
}


.btn-guide{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:34px;
    height:34px;
    border-radius:50%;
    background:#dc3545;
    color:#fff;
    text-decoration:none;
    font-size:16px;
}

.btn-guide:hover{
    background:#b02a37;
    color:#fff;
}

.btn-open{
    background:#003E7E;
    color:white;
}

.btn-open:hover{
    background:#002f60;
    color:white;
}

.stats{
    color:#6b7280;
    font-size:14px;
    margin-bottom:10px;
}

.back-home{
    display:inline-block;
    margin-top:15px;
    background:white;
    color:#003E7E;
    text-decoration:none;
    padding:9px 18px;
    border-radius:30px;
    font-weight:600;
    font-size:14px;
}

.back-home:hover{
    background:#eef4ff;
    color:#002f60;
}


.portal-container{
    width:100%;
    max-width:1780px;
    margin:0 auto;
    padding-left:28px;
    padding-right:28px;
}

.portal-layout{
    display:grid;
    grid-template-columns:250px minmax(0,1fr) 350px;
    gap:24px;
    align-items:start;
    margin-top:25px;
    margin-bottom:60px;
}

.portal-layout.no-campaign{
    grid-template-columns:minmax(0,1fr) 350px;
}

.portal-layout .card-custom{
    margin-top:0;
    margin-bottom:0;
}

.quick-access-panel{
    position:sticky;
    top:22px;
}

.quick-access-title{
    color:#003E7E;
    font-size:30px;
    font-weight:300;
    margin:0 0 16px;
}

.quick-access-list{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.quick-access-card{
    display:grid;
    grid-template-columns:92px minmax(0,1fr) 42px;
    gap:14px;
    align-items:center;
    background:linear-gradient(135deg,#f1f6ff,#ffffff);
    border:1px solid #d7e5f7;
    border-radius:18px;
    padding:16px;
    text-decoration:none;
    box-shadow:0 4px 14px rgba(0,62,126,.06);
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}

.quick-access-card:hover{
    transform:translateY(-2px);
    border-color:#aac7ea;
    box-shadow:0 12px 28px rgba(0,62,126,.12);
}

.quick-access-image{
    width:92px;
    height:76px;
    border-radius:12px;
    background:#fff;
    border:1px solid #e4e9f0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:8px;
}

.quick-access-image img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.quick-access-placeholder{
    font-size:32px;
}

.quick-access-content{
    min-width:0;
}

.quick-access-content h3{
    color:#003E7E;
    font-size:17px;
    font-weight:700;
    margin:0 0 7px;
    line-height:1.3;
}

.quick-access-description{
    color:#4b5563;
    font-size:13px;
    line-height:1.45;
    margin-bottom:10px;
}

.quick-access-meta{
    display:grid;
    grid-template-columns:1fr;
    gap:6px;
}

.quick-access-meta div{
    border-top:1px solid #d9e3f0;
    padding-top:6px;
}

.quick-access-meta span{
    display:block;
    color:#64748b;
    font-size:9px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
}

.quick-access-meta strong{
    display:block;
    color:#111827;
    font-size:12px;
    font-weight:500;
    margin-top:2px;
}

.quick-access-arrow{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#003E7E;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    box-shadow:0 7px 16px rgba(0,62,126,.20);
}

.quick-access-empty{
    background:#fff;
    border:1px dashed #cbd5e1;
    border-radius:16px;
    padding:22px;
    color:#64748b;
    text-align:center;
    font-size:14px;
}


/* =====================================================
   TICKER
   ===================================================== */

.ticker-bar{
    background:#ffffff;
    border-bottom:1px solid #dfe7f2;
    box-shadow:0 2px 10px rgba(0,62,126,.05);
}

.ticker-inner{
    min-height:46px;
    display:flex;
    align-items:center;
    gap:14px;
    overflow:hidden;
}

.ticker-label{
    flex:0 0 auto;
    background:#003E7E;
    color:#ffffff;
    border-radius:999px;
    padding:6px 12px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.8px;
    text-transform:uppercase;
}

.ticker-viewport{
    min-width:0;
    flex:1;
    overflow:hidden;
    white-space:nowrap;
}

.ticker-track{
    display:inline-flex;
    align-items:center;
    width:max-content;
    animation:swsTicker 34s linear infinite;
}

.ticker-bar:hover .ticker-track{
    animation-play-state:paused;
}

.ticker-item{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:#26364a;
    font-size:14px;
    padding-right:46px;
}

.ticker-dot{
    color:#9fb2ca;
    margin-right:18px;
}

@keyframes swsTicker{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
}


/* =====================================================
   CAMPAIGN PANEL
   ===================================================== */

.campaign-panel{
    position:sticky;
    top:22px;
}

.campaign-title{
    color:#003E7E;
    font-size:30px;
    font-weight:300;
    margin:0 0 16px;
}

.campaign-list{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.campaign-card{
    background:#ffffff;
    border:1px solid #d7e5f7;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 14px rgba(0,62,126,.06);
}

.campaign-card-link{
    display:block;
    color:inherit;
    text-decoration:none;
}

.campaign-image{
    width:100%;
    aspect-ratio:4 / 5;
    background:#eef4ff;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.campaign-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.campaign-image-placeholder{
    font-size:42px;
}

.campaign-content{
    padding:14px 15px 16px;
}

.campaign-content h3{
    color:#003E7E;
    font-size:17px;
    font-weight:700;
    margin:0 0 7px;
    line-height:1.3;
}

.campaign-content p{
    color:#4b5563;
    font-size:13px;
    line-height:1.45;
    margin:0;
}

.campaign-empty{
    background:#ffffff;
    border:1px dashed #cbd5e1;
    border-radius:16px;
    padding:20px;
    color:#64748b;
    text-align:center;
    font-size:13px;
}

@media(max-width:1400px){
    .portal-layout{
        grid-template-columns:220px minmax(0,1fr) 320px;

    }

    .portal-layout.no-campaign{
        grid-template-columns:minmax(0,1fr) 320px;
    }
}

@media(max-width:1200px){
    .portal-layout{
        grid-template-columns:minmax(0,1fr) 320px;
    }

    .quick-access-card{
        grid-template-columns:76px minmax(0,1fr) 38px;
        padding:14px;
    }

    .quick-access-image{

    }
}

@media(max-width:992px){

        grid-template-columns:1fr;

    .quick-access-panel{

    .quick-access-list{

        grid-template-columns:repeat(2,minmax(0,1fr));

}

@media(max-width:650px){

    .card-custom{

}


@media(max-width:1200px){
    .portal-layout,
    .portal-layout.no-campaign{

    }

}

@media(max-width:992px){
    .portal-layout,
    .portal-layout.no-campaign{
        grid-template-columns:1fr;

}

    .ticker-item{
        font-size:13px;
        padding-right:34px;
    }

    .campaign-list,
    .quick-access-list{
        grid-template-columns:1fr;
    }
}

</style>

<script>
/*
PORTAL CACHE VERSION: 20260814-03
When publishing a new portal revision, change this version value
in all three HTML files, for example: 20260721-02.
*/
const PORTAL_VERSION = "20260814-03";

const API_URL = "https://script.google.com/macros/s/AKfycbw7Sh18-XRU-WkgARONPe6eeJbgxFluUzGBs_DXwq8Y80YAdGnZ711s4y8X7OmqqhEnrA/exec";


/*
=========================================================
HOW TO USE THIS FILE WITHOUT IIS
=========================================================

Recommended server folder structure:

\\SERVER\SWS-HQ-Portal\
│
├── hq.html
└── documents\
    ├── HR\
    │   ├── HR-01.pdf
    │   └── HR-02.pdf
    ├── Procurement\
    │   └── PR-01.pdf
    └── Quality\
        └── QA-01.pdf

For documents stored inside the same portal folder, use links like:

documents/HR/HR-01.pdf

You may also use a full server path, for example:

\\SERVER\Quality\QA-01.pdf

or a mapped drive path:

Q:\1. HQ\1. QUALITY\1. PROCEDURES\QA-01.pdf

To add, remove, or update documents, edit the documents array below.
*/


/*
=========================================================
QUICK ACCESS
=========================================================
Edit the items below to change the HQ Quick Access panel.

image:
- Use a direct image URL, or
- Use a local image such as "images/quality-induction.png"

link:
- Website: https://...
- Relative page/file: folder/file.html
*/

const quickAccessItems = [
    {
        title: "SWS Quality Induction",
        description: "No description available.",
        applicability: "Worksite & HQ",
        owner: "Quality Department",
        image: "https://dummyimage.com/240x160/ffffff/003e7e.png&text=SWS+QUALITY%0AINDUCTION",
        link: "https://www.youtube.com/watch?v=s98qxYBhgvs"
    },
    {
        title: "Quality Dashboard",
        description: "Open the latest SWS quality performance dashboard.",
        applicability: "HQ",
        owner: "Quality Department",
        image: "",
        link: "#"
    },
    {
        title: "IMS Manual",
        description: "Quick access to the current Integrated Management System Manual.",
        applicability: "HQ",
        owner: "QHSE Department",
        image: "",
        link: "#"
    }
];



async function loadPortalData(){
    const stats = document.getElementById("stats");

    try{
        stats.textContent = "Loading documents...";

        const response = await fetch(
            "documents.json?t=" + Date.now(),
            { cache: "no-store" }
        );

        if(!response.ok){
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if(
            !data ||
            !data.success ||
            !Array.isArray(data.documents)
        ){
            throw new Error("Invalid documents.json");
        }

        renderTicker(
            Array.isArray(data.hqTicker) ? data.hqTicker : []
        );

        renderCampaign(
        Array.isArray(data.hqCampaign) ? data.hqCampaign : []
        );

        renderDocuments(data.documents);

    }catch(error){
        console.error("Portal load error:", error);

        stats.innerHTML = `
            Unable to load portal data.
            <button
                type="button"
                class="btn btn-sm btn-outline-primary ms-2"
                onclick="loadPortalData()"
            >
                Retry
            </button>
        `;
    }
}

function safe(value){
    return value ? String(value).trim() : "";
}

function escapeHTML(value){
    return safe(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function encodePath(path){
    return path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");
}


function getYouTubeId(url){
    const value = safe(url);

    if(!value){
        return "";
    }

    const match = value.match(
        /(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/
    );

    return match ? match[1] : "";
}


function getGoogleDriveId(url){
    const value = safe(url);

    if(!value){
        return "";
    }

    let match = value.match(/drive\.google\.com\/file\/d\/([^/?#]+)/);

    if(match){
        return match[1];
    }

    match = value.match(/[?&]id=([^&#]+)/);

    if(value.includes("drive.google.com") && match){
        return match[1];
    }

    return "";
}


function getCampaignMedia(url){
    const value = safe(url);

    if(!value){
        return {
            previewUrl: "",
            openUrl: "",
            isVideo: false
        };
    }

    const youtubeId = getYouTubeId(value);

    if(youtubeId){
        return {
            previewUrl: `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`,
            openUrl: value,
            isVideo: true
        };
    }

    const driveId = getGoogleDriveId(value);

    if(driveId){
        return {
            previewUrl: `https://drive.google.com/thumbnail?id=${encodeURIComponent(driveId)}&sz=w1200`,
            openUrl: value,
            isVideo: false
        };
    }

    return {
        previewUrl: value,
        openUrl: value,
        isVideo: false
    };
}


function renderTicker(items){
    const bar = document.getElementById("tickerBar");
    const track = document.getElementById("tickerTrack");

    const activeItems = (items || [])
        .filter(item => safe(item.message));

    if(!activeItems.length){
        bar.hidden = true;
        track.innerHTML = "";
        return;
    }

    const setHTML = activeItems.map(item => `
        <span class="ticker-item">
            <span>${escapeHTML(item.icon || "📢")}</span>
            <span>${escapeHTML(item.message)}</span>
            <span class="ticker-dot">•</span>
        </span>
    `).join("");

    // Duplicate the set to produce a continuous marquee loop.
    track.innerHTML = setHTML + setHTML;
    bar.hidden = false;
}


function renderCampaign(items){
    const panel = document.getElementById("campaignPanel");
    const list = document.getElementById("campaignList");
    const layout = document.getElementById("portalLayout");

    // New JSON field is mediaUrl.
    // imageUrl remains as a fallback so older snapshots do not break the page.
    const activeItems = (items || [])
        .filter(item =>
            safe(item.title) ||
            safe(item.mediaUrl) ||
            safe(item.imageUrl)
        );

    if(!activeItems.length){
        panel.hidden = true;
        list.innerHTML = "";
        layout.classList.add("no-campaign");
        return;
    }

    panel.hidden = false;
    layout.classList.remove("no-campaign");

    list.innerHTML = activeItems.map(item => {
        const rawMediaUrl = safe(item.mediaUrl || item.imageUrl);
        const media = getCampaignMedia(rawMediaUrl);

        const imageHTML = media.previewUrl
            ? `
                <div style="position:relative;width:100%;height:100%;">
                    <img
                        src="${escapeHTML(media.previewUrl)}"
                        alt="${escapeHTML(item.title || "Campaign")}"
                    >

                    ${media.isVideo ? `
                        <span style="
                            position:absolute;
                            left:50%;
                            top:50%;
                            transform:translate(-50%,-50%);
                            width:56px;
                            height:56px;
                            border-radius:50%;
                            background:rgba(0,0,0,.68);
                            color:#fff;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:23px;
                            padding-left:3px;
                            pointer-events:none;
                        ">▶</span>
                    ` : ""}
                </div>
            `
            : `<span class="campaign-image-placeholder">📣</span>`;

        const inner = `
            <div class="campaign-image">
                ${imageHTML}
            </div>

            <div class="campaign-content">
                <h3>${escapeHTML(item.title || "Campaign")}</h3>
                <p>${escapeHTML(item.description || "")}</p>
            </div>
        `;

        if(media.openUrl){
            return `
                <div class="campaign-card">
                    <a
                        class="campaign-card-link"
                        href="${escapeHTML(media.openUrl)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        ${inner}
                    </a>
                </div>
            `;
        }

        return `
            <div class="campaign-card">
                ${inner}
            </div>
        `;
    }).join("");
}

function getDocumentLink(doc){
    const link = safe(doc.link);

    if(!link){
        return "#";
    }

    // Full web link
    if(/^https?:\/\//i.test(link)){
        return link;
    }

    // UNC network path: \\SERVER\Folder\File.pdf
    if(link.startsWith("\\\\")){
        return "file://///" + link
            .replace(/^\\+/, "")
            .replaceAll("\\", "/")
            .split("/")
            .map(part => encodeURIComponent(part))
            .join("/");
    }

    // Mapped drive path: Q:\Folder\File.pdf
    if(/^[A-Za-z]:\\/.test(link)){
        return "file:///" + link
            .replaceAll("\\", "/")
            .split("/")
            .map(part => encodeURIComponent(part))
            .join("/");
    }

    // Relative link inside the same server folder
    return encodePath(link);
}

function getVideoLink(doc){
    return safe(doc.videoLink || doc.video || doc.youtubeLink);
}

function renderGuideButton(doc){
    const videoLink = getVideoLink(doc);

    if(!videoLink){
        return "";
    }

    return `
        <a
            href="${escapeHTML(videoLink)}"
            target="_blank"
            rel="noopener noreferrer"
            class="btn-guide"
            title="Watch Guide"
            aria-label="Watch Guide"
        >▶</a>
    `;
}


function renderQuickAccess(){
    const container = document.getElementById("quickAccessList");

    if(!quickAccessItems.length){
        container.innerHTML = `
            <div class="quick-access-empty">
                No Quick Access item available.
            </div>
        `;
        return;
    }

    container.innerHTML = quickAccessItems.map(item => {
        const image = safe(item.image);
        const imageHTML = image
            ? `<img src="${escapeHTML(image)}" alt="${escapeHTML(item.title)}">`
            : `<span class="quick-access-placeholder">📄</span>`;

        return `
            <a
                class="quick-access-card"
                href="${escapeHTML(item.link || "#")}"
                target="_blank"
                rel="noopener noreferrer"
            >
                <div class="quick-access-image">
                    ${imageHTML}
                </div>

                <div class="quick-access-content">
                    <h3>${escapeHTML(item.title)}</h3>

                    <div class="quick-access-description">
                        ${escapeHTML(item.description || "No description available.")}
                    </div>

                    <div class="quick-access-meta">
                        <div>
                            <span>Applicability</span>
                            <strong>${escapeHTML(item.applicability || "-")}</strong>
                        </div>

                        <div>
                            <span>Owner</span>
                            <strong>${escapeHTML(item.owner || "-")}</strong>
                        </div>
                    </div>
                </div>

                <span class="quick-access-arrow">→</span>
            </a>
        `;
    }).join("");
}

function renderDocuments(docs){
    const departments = {};

    docs.forEach(doc => {
        const department = safe(doc.department) || "Unassigned";

        if(!departments[department]){
            departments[department] = [];
        }

        departments[department].push(doc);
    });

    document.getElementById("stats").innerHTML =
        docs.length + " document(s) available";

    let html = "";

    Object.keys(departments).sort().forEach(department => {
        html += `
            <div class="department-header">
                ${escapeHTML(department)}
                (${departments[department].length})
            </div>

            <table class="table table-hover doc-table">
                <colgroup>
                    <col class="col-docno">
                    <col class="col-title">
                    <col class="col-type">
                    <col class="col-rev">
                    <col class="col-date">
                    <col class="col-open">
                    <col class="col-guide">
                </colgroup>

                <thead>
                    <tr>
                        <th>Document No</th>
                        <th>Title</th>
                        <th>Type</th>
                        <th class="text-center">Rev</th>
                        <th>Rev Date</th>
                        <th class="text-center">Open</th>
                        <th class="text-center">Guide</th>
                    </tr>
                </thead>

                <tbody>
        `;

        departments[department].forEach(doc => {
            html += `
                <tr>
                    <td>${escapeHTML(doc.docNo)}</td>
                    <td>${escapeHTML(doc.title)}</td>
                    <td>${escapeHTML(doc.type)}</td>
                    <td class="text-center">${escapeHTML(doc.revNo)}</td>
                    <td>${escapeHTML(doc.revDate)}</td>
                    <td class="text-center">
                        <a
                            href="${getDocumentLink(doc)}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="btn btn-sm btn-open"
                        >Open</a>
                    </td>
                    <td class="text-center">${renderGuideButton(doc)}</td>
                </tr>
            `;
        });

        html += `
                </tbody>
            </table>
        `;
    });

    document.getElementById("content").innerHTML =
        html || "No document found.";
}

function applySearch(){
    const searchBox = document.getElementById("searchBox");
    const search = safe(searchBox.value).toLowerCase();

    document.querySelectorAll("tbody tr").forEach(row => {
        row.style.display =
            row.innerText.toLowerCase().includes(search) ? "" : "none";
    });
}

document.getElementById("searchBox").addEventListener("input", applySearch);

renderQuickAccess();
loadPortalData();

</script>


</body>

</html>
